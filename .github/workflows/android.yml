name: Android · comprobar y crear APK de prueba
on:
  push:
    branches: ["feat/android-**"]
    paths: ["android/**", "tests/fixtures/**", ".github/workflows/android.yml"]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: glass-music-android-test-signing-v1
      - name: Prepare synthetic audio fixtures
        run: |
          mkdir -p android/app/src/debug/assets
          cp tests/fixtures/first.flac tests/fixtures/second.mp3 android/app/src/debug/assets/
      - name: Unit tests, lint and APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real FLAC/MP3 and interface tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n com.eaysix.glassmusic.android/.MainActivity
            adb exec-out screencap -p > android-screen.png
      - name: Identify APK
        run: |
          mkdir -p android/build/artifacts
          NAME="Glass-Music-Android-0.1.0-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/build/artifacts/$NAME"
          echo "GLASS_APK=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GLASS_APK }}
          path: android/build/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glass-Music-Android-TestResults
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android-screen.png
          retention-days: 7
