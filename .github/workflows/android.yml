name: Android · pruebas y candidato manual
on:
  push:
    branches: ["feat/android-**", "release/android-**"]
    paths:
      [
        "android/**",
        "tests/fixtures/**",
        "crates/glass-sync/**",
        ".github/workflows/android.yml",
      ]
  workflow_dispatch:
    inputs:
      package:
        description: "Crear APK candidata después de las pruebas"
        type: boolean
        default: false
concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: glass-music-android-test-signing-v1
      - name: Prepare synthetic audio fixtures
        run: |
          mkdir -p android/app/src/debug/assets
          cp tests/fixtures/first.flac tests/fixtures/second.mp3 android/app/src/debug/assets/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glass-sync
      - name: Verify the unchanged Windows and iPhone protocol
        run: cargo test --locked --manifest-path crates/glass-sync/Cargo.toml && cargo build --locked --manifest-path crates/glass-sync/Cargo.toml --example test_hub
      - name: Unit tests, lint and APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real FLAC/MP3 and interface tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            crates/glass-sync/target/debug/examples/test_hub /tmp/AndroidHub.json > /tmp/glass-android-hub.log 2>&1 &
            for attempt in $(seq 1 30); do test -f /tmp/AndroidHub.json && break; sleep 1; done
            PORT=$(python3 -c 'import json;print(json.load(open("/tmp/AndroidHub.json"))["port"])')
            adb reverse tcp:$PORT tcp:$PORT
            HUB=$(base64 -w0 /tmp/AndroidHub.json)
            cd android && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.hub=$HUB
            adb pull /sdcard/Pictures/GlassMusic "$GITHUB_WORKSPACE/android-screenshots" || true
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -W -n com.eaysix.glassmusic.android/.MainActivity
            sleep 1
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/android-screen.png"
      - name: Identify APK
        if: startsWith(github.ref_name, 'release/android-') || inputs.package == true
        run: |
          mkdir -p android/build/artifacts
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          NAME="Glass-Music-Android-$VERSION-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/build/artifacts/$NAME"
          echo "GLASS_APK=$NAME" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref_name, 'release/android-') || inputs.package == true
        with:
          name: ${{ env.GLASS_APK }}
          path: android/build/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glass-Music-Android-TestResults
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android-screen.png
            android-screenshots/
          retention-days: 7
