name: iPhone · comprobar y crear IPA de prueba
on:
  push:
    branches: ["feat/ios-**"]
  pull_request:
    paths: ["ios/**", "crates/glass-sync/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glass-sync
      - run: cargo test --locked --manifest-path crates/glass-sync/Cargo.toml
  iphone:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode with Liquid Glass SDK
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          candidates=[]
          for app in pathlib.Path('/Applications').glob('Xcode_26*.app'):
              version=re.fullmatch(r'Xcode_(26(?:\.\d+)*)\.app', app.name)
              if version: candidates.append((tuple(map(int, version[1].split('.'))), app))
          assert candidates, 'A stable Xcode 26 installation is required for native Liquid Glass'
          selected=max(candidates)[1] / 'Contents/Developer'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVELOPER_DIR='+str(selected)+'\n')
          print('Selected', selected)
          PY
      - run: xcodebuild -version
      - run: brew install xcodegen
      - name: Prepare synthetic audio fixtures
        run: cp tests/fixtures/* ios/Resources/Fixtures/
      - run: xcodegen generate
        working-directory: ios
      - name: Build unsigned device app
        working-directory: ios
        run: xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/GlassMusic.app build/ipa/Payload/
          cd build/ipa
          zip -qry Glass-Music-iPhone-0.1.1-unsigned.ipa Payload
      - name: Select simulator
        run: |
          xcrun simctl list devices available -j > /tmp/glass-simulators.json
          python3 - <<'PY'
          import json, os
          devices=json.load(open('/tmp/glass-simulators.json'))['devices']
          modern=[d for runtime, ds in devices.items() if 'iOS-26' in runtime for d in ds if 'iPhone' in d['name'] and d['isAvailable']]
          assert modern, 'No iOS 26 iPhone simulator available'
          selected=next((d for d in modern if d['name']=='iPhone 16 Pro'),modern[0])
          legacy=[d for runtime, ds in devices.items() if 'iOS-18-5' in runtime for d in ds if 'iPhone SE' in d['name'] and d['isAvailable']]
          if not legacy: legacy=[d for d in modern if 'iPhone SE' in d['name']]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('GLASS_SIMULATOR='+selected['udid']+'\n')
              f.write('GLASS_LEGACY_SIMULATOR='+(legacy[0]['udid'] if legacy else '')+'\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glass-sync
      - name: Build LAN integration fixture
        run: cargo build --locked --manifest-path crates/glass-sync/Cargo.toml --example test_hub
      - name: Build simulator tests
        working-directory: ios
        run: xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Debug -destination "platform=iOS Simulator,id=$GLASS_SIMULATOR" -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing
      - name: Unit, native LAN and interface tests
        run: |
          APP=ios/build/simulator/Build/Products/Debug-iphonesimulator/GlassMusic.app
          test -f "$APP/first.flac" || test -f "$APP/Fixtures/first.flac"
          crates/glass-sync/target/debug/examples/test_hub /tmp/HubFixture.json > /tmp/glass-hub.log 2>&1 &
          HUB_PID=$!
          trap 'kill "$HUB_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if test -f /tmp/HubFixture.json; then break; fi
            sleep 1
          done
          cp /tmp/HubFixture.json "$APP/PlugIns/GlassMusicTests.xctest/HubFixture.json"
          codesign --force --sign - --preserve-metadata=entitlements "$APP/PlugIns/GlassMusicTests.xctest"
          codesign --force --sign - --preserve-metadata=entitlements "$APP"
          cd ios
          xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Debug -destination "platform=iOS Simulator,id=$GLASS_SIMULATOR" -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 test-without-building
      - name: Small iPhone compatibility and navigation test
        if: env.GLASS_LEGACY_SIMULATOR != ''
        working-directory: ios
        run: xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Debug -destination "platform=iOS Simulator,id=$GLASS_LEGACY_SIMULATOR" -derivedDataPath build/simulator -resultBundlePath build/CompactTestResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 -only-testing:GlassMusicUITests/GlassMusicUITests/testPlayerLeavesAllNavigationAccessibleInPortraitAndLandscape test-without-building
      - name: Export interface screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path ios/build/TestResults.xcresult --output-path ios/build/screenshots
          if test -d ios/build/CompactTestResults.xcresult; then
            xcrun xcresulttool export attachments --path ios/build/CompactTestResults.xcresult --output-path ios/build/compact-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glass-Music-iPhone-Screenshots
          path: |
            ios/build/screenshots
            ios/build/compact-screenshots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Glass-Music-iPhone-IPA-unsigned
          path: ios/build/ipa/Glass-Music-iPhone-0.1.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glass-Music-iPhone-TestResults
          path: |
            ios/build/TestResults.xcresult
            ios/build/CompactTestResults.xcresult
          retention-days: 7
