name: iPhone · comprobar y crear IPA de prueba
on:
  push:
    branches: ["feat/ios-**"]
  pull_request:
    paths: ["ios/**", "crates/glass-sync/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glass-sync
      - run: cargo test --locked --manifest-path crates/glass-sync/Cargo.toml
  iphone:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Prepare synthetic audio fixtures
        run: cp tests/fixtures/* ios/Resources/Fixtures/
      - run: xcodegen generate
        working-directory: ios
      - name: Build unsigned device app
        working-directory: ios
        run: xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/GlassMusic.app build/ipa/Payload/
          cd build/ipa
          zip -qry Glass-Music-iPhone-0.1.0-unsigned.ipa Payload
      - name: Select simulator
        run: |
          xcrun simctl list devices available -j > /tmp/glass-simulators.json
          python3 - <<'PY'
          import json, os
          devices=json.load(open('/tmp/glass-simulators.json'))['devices']
          iphones=[d for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if 'iPhone' in d['name'] and d['isAvailable']]
          assert iphones, 'No iPhone simulator available'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GLASS_SIMULATOR='+iphones[0]['udid']+'\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/glass-sync
      - name: Build LAN integration fixture
        run: cargo build --locked --manifest-path crates/glass-sync/Cargo.toml --example test_hub
      - name: Build simulator tests
        working-directory: ios
        run: xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Debug -destination "platform=iOS Simulator,id=$GLASS_SIMULATOR" -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Unit, native LAN and interface tests
        run: |
          APP=ios/build/simulator/Build/Products/Debug-iphonesimulator/GlassMusic.app
          test -f "$APP/first.flac" || test -f "$APP/Fixtures/first.flac"
          crates/glass-sync/target/debug/examples/test_hub /tmp/HubFixture.json > /tmp/glass-hub.log 2>&1 &
          HUB_PID=$!
          trap 'kill "$HUB_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if test -f /tmp/HubFixture.json; then break; fi
            sleep 1
          done
          cp /tmp/HubFixture.json "$APP/PlugIns/GlassMusicTests.xctest/HubFixture.json"
          cd ios
          xcodebuild -project GlassMusic.xcodeproj -scheme GlassMusic -configuration Debug -destination "platform=iOS Simulator,id=$GLASS_SIMULATOR" -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 test-without-building
      - name: Export interface screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path ios/build/TestResults.xcresult --output-path ios/build/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glass-Music-iPhone-Screenshots
          path: ios/build/screenshots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Glass-Music-iPhone-IPA-unsigned
          path: ios/build/ipa/Glass-Music-iPhone-0.1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Glass-Music-iPhone-TestResults
          path: ios/build/TestResults.xcresult
          retention-days: 7
