[package]
name = "glass-music"
version = "0.4.0"
description = "Tu música local, a tu manera"
authors = ["Eaysix"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "glass_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22.4"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3"] }
walkdir = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
discord-rich-presence = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }
